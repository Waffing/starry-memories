<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星河回忆 · 后台管理</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="container">
<header>
  <h1>✦ 梦幻相册 · 后台管理</h1>
  <div class="btn-group">
    <button class="btn btn-primary" onclick="previewAlbum()">👁 预览相册</button>
    <button class="btn" onclick="exportData()">📜 导出数据</button>
    <button class="btn" onclick="importData()">📛 导入数据</button>
    <button class="btn btn-danger" onclick="clearAll()">🗑 清空全部</button>
    <button class="btn" onclick="debugStorage()" style="margin-left:0.5rem">🔳 诊断</button>
  </div>
</header>

<!-- 上传 -->
<div class="section">
  <h2>📷 照片管理</h2>
  <div class="upload-zone" id="uploadZone" onclick="triggerUpload()">
    <div class="icon">📁</div>
    <p>点击或拖拽上传照片 · 支持原片上传 · 存储上限约 1GB</p>
  </div>
  <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(this.files)">
  <div class="photo-grid" id="photoGrid"></div>
</div>

<!-- 设置 -->
<div class="section">
  <h2>⚙ 全局设置</h2>
  <div class="settings-grid">
    <div class="setting-card"><label>Logo 文字</label><input type="text" id="setLogo" value="WXY" maxlength="10"><label>章节时长 (毫秒)</label><input type="number" id="setDuration" value="5000" min="2000" max="30000"></div>
  </div>
  <div style="margin-top:1rem"><button class="btn btn-primary" onclick="saveAll()">💾 保存设置</button></div>
</div>

<!-- 章节 -->
<div class="section">
  <h2>📖 章节设置</h2>
  <div class="settings-grid" id="chapterSettings"></div>
</div>
</div>
<div class="toast" id="toast"></div>

<script src="js/admin-app.js"></script>
</body>
</html>
